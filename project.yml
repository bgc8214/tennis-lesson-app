name: TennisLesson
options:
  bundleIdPrefix: com.bossback
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: C2N3L6375X
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  TennisCore:
    path: TennisCore
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.0.0

targetTemplates:
  TennisLessonApp:
    type: application
    sources:
      - path: TennisLesson
    dependencies:
      - package: TennisCore
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bossback.tennislesson
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES

# GENERATE_INFOPLIST_FILE(Xcode 자동 합성)는 CFBundleDisplayName 등 "알려진"
# 표준 키만 INFOPLIST_KEY_*에서 받아준다 — GEMINI_API_KEY 같은 커스텀 키는
# 조용히 무시됨(실측: 빌드 세팅엔 값이 있는데 최종 Info.plist엔 안 들어감).
# xcodegen의 info.properties로 실제 Info.plist 파일을 만들어야 $(VAR) 치환이
# 커스텀 키에도 적용된다.
targets:
  TennisLesson-iOS:
    templates: [TennisLessonApp]
    platform: iOS
    info:
      path: TennisLesson-iOS-Info.plist
      properties:
        CFBundleDisplayName: 오늘의테니스
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        GEMINI_API_KEY: $(GEMINI_API_KEY)
        GEMINI_MODEL: $(GEMINI_MODEL)
        # BGContinuedProcessingTask(iOS 26) — 화면 잠금/다른 앱 전환으로 분석이
        # 끊기던 문제(2026-07-26 실사용 확인) 해결: 사용자가 포그라운드에서 시작한
        # 분석을 백그라운드에서도 계속하고 시스템 UI로 진행률을 보여준다.
        UIBackgroundModes: [processing]
        # 2026-07-26 실기기 크래시로 확인: register()/submit()는 반드시 동일한
        # "구체적" 식별자를 써야 한다 — 와일드카드 문자열 자체를 register()나
        # submit()에 넘기면 "No launch handler registered..."로 즉시 크래시한다.
        # 이 앱은 항상 분석 1개만 도니 와일드카드 없이 고정 식별자 하나면 충분.
        BGTaskSchedulerPermittedIdentifiers: ["com.bossback.tennislesson.analyze.session"]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"

  TennisLesson-macOS:
    templates: [TennisLessonApp]
    platform: macOS
    info:
      path: TennisLesson-macOS-Info.plist
      properties:
        CFBundleDisplayName: 오늘의테니스
        NSHumanReadableCopyright: ""
        GEMINI_API_KEY: $(GEMINI_API_KEY)
        GEMINI_MODEL: $(GEMINI_MODEL)
    settings:
      base:
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  TennisLesson-iOS:
    build:
      targets:
        TennisLesson-iOS: all
    run:
      config: Debug
    archive:
      config: Release

  TennisLesson-macOS:
    build:
      targets:
        TennisLesson-macOS: all
    run:
      config: Debug
    archive:
      config: Release
